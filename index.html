<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Familientipp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: eine Spalte wie ein Tippschein – Rasenstreifen-Kopf, Ligawahl, Reiter, darunter die Spiele */
:root{
  --paper:#f3f6f2; --card:#ffffff; --ink:#13211a; --muted:#5a6a61; --line:#d9e2db;
  --pitch:#1f6b3a; --pitch-2:#246f3f; --on-pitch:#ffffff;
  --gold:#f2b705; --gold-ink:#3b2c00;
  --p3:#f2b705; --p2:#2f9e5b; --p1:#3b7dd8; --p0:#c4cdc7;
  --live:#d6453d;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1612; --card:#16211b; --ink:#e7eee9; --muted:#93a39a; --line:#26352c;
  --pitch:#164d2a; --pitch-2:#1a5530; --gold:#f5c533; --gold-ink:#2a1f00;
  --p3:#f5c533; --p2:#3fb26c; --p1:#5b96e6; --p0:#3a4a41; --live:#ef6a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1612; --card:#16211b; --ink:#e7eee9; --muted:#93a39a; --line:#26352c;
  --pitch:#164d2a; --pitch-2:#1a5530; --gold:#f5c533; --gold-ink:#2a1f00;
  --p3:#f5c533; --p2:#3fb26c; --p1:#5b96e6; --p0:#3a4a41; --live:#ef6a62; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
.head{background:repeating-linear-gradient(90deg,var(--pitch) 0 56px,var(--pitch-2) 56px 112px);color:var(--on-pitch);position:relative;overflow:hidden}
.head::after{content:"";position:absolute;left:50%;top:-60px;width:180px;height:180px;border:3px solid rgba(255,255,255,.18);border-radius:50%;transform:translateX(-50%);pointer-events:none}
.head .wrap{padding-block:18px 14px;position:relative;z-index:1;display:grid;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font:900 clamp(34px,8vw,46px)/.9 var(--font-display);letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.brand small{opacity:.85;font-size:13px}
.leagues{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.leagues::-webkit-scrollbar{display:none}
.leagues button{flex:0 0 auto;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.leagues button[aria-pressed="true"]{background:#fff;color:var(--pitch);border-color:#fff}

/* Reiter */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.tabs .wrap{display:flex;gap:4px}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 10px;font-weight:800;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}

main .wrap{padding-block:16px 120px;display:grid;gap:16px}

/* Spieltag-Navigation */
.roundnav{display:flex;align-items:center;gap:8px}
.roundnav select{flex:1;min-width:0;appearance:none;border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-align:center}
.iconbtn{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:2px solid var(--line);background:var(--card);font:800 22px/1 var(--font-display);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}

.notice{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.notice h3{margin:0;font:800 22px/1.1 var(--font-display);text-transform:uppercase}
.notice p{margin:0;color:var(--muted)}
.notice.err{border-color:var(--live)}

.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;background:var(--pitch);color:#fff}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.danger{background:var(--live);color:#fff}

/* Spieler-Auswahl */
.who{display:grid;gap:8px}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 5px;font-weight:800}
.pchip[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset}
.av{width:30px;height:30px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font:900 16px/1 var(--font-display);flex:0 0 auto}
.pchip .cnt{font-size:12px;color:var(--muted);font-weight:600}

/* Spiele */
.day{display:grid;gap:8px}
.day h4{margin:6px 0 0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.match{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;line-height:1.15}
.team.away{justify-content:flex-end;text-align:right}
.team img{width:28px;height:28px;object-fit:contain;flex:0 0 28px}
.team span{min-width:0;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.pill.live{background:var(--live);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.pill.done{background:var(--ink);color:var(--paper)}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.pill.live{animation:none}}

.board{display:flex;align-items:center;gap:4px;font:900 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.board b{display:inline-grid;place-items:center;min-width:38px;height:44px;border-radius:8px;background:var(--ink);color:var(--paper);padding:0 4px}
.board i{font-style:normal;opacity:.5}
.board .time{font:800 20px/1 var(--font-display);background:none;color:var(--muted);min-width:0;padding:0}

/* Tipp-Eingabe */
.tipin{display:grid;grid-template-columns:auto auto auto;align-items:center;gap:6px;justify-content:center}
.step{display:flex;flex-direction:column;align-items:center;gap:4px}
.step button{width:44px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font:900 22px/1 var(--font-display)}
.step button:active{transform:scale(.95)}
.digit{width:52px;height:56px;border-radius:10px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:900 38px/1 var(--font-display);font-variant-numeric:tabular-nums}
.digit.empty{background:var(--line);color:var(--muted)}
.tipin .colon{font:900 32px/1 var(--font-display);opacity:.5}
.locked .digit{background:var(--line);color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline}

.progress{display:flex;align-items:center;gap:10px;font-weight:800}
.bar{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .3s}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--paper) 30%);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:24px}
.dock .wrap{display:flex;justify-content:center}
.dock .btn{width:100%;max-width:480px;padding:16px;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* Tipps aller */
.tips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.tchip{display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--paper);padding:3px 4px 3px 3px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.tchip .av{width:24px;height:24px;font-size:13px}
.tchip .hid{font-weight:600;color:var(--muted);font-size:12px}
.pts{min-width:26px;height:22px;border-radius:999px;display:grid;place-items:center;font:900 14px/1 var(--font-display);padding:0 6px;color:#fff}
.pts.p3{background:var(--p3);color:var(--gold-ink)}.pts.p2{background:var(--p2)}.pts.p1{background:var(--p1)}.pts.p0{background:var(--p0);color:var(--ink)}
.pts.prov{opacity:.6}

/* Tabelle */
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;padding-top:8px}
.pod{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.pod .av{width:48px;height:48px;font-size:24px}
.pod .nm{font-weight:800;overflow-wrap:anywhere;line-height:1.1}
.pod .block{width:100%;border-radius:10px 10px 0 0;background:var(--pitch);color:#fff;display:grid;place-items:center;font:900 34px/1 var(--font-display);padding:8px 0}
.pod .block small{display:block;font:700 12px/1 var(--font-body);opacity:.85;margin-top:4px}
.pod.r1 .block{height:118px;background:var(--gold);color:var(--gold-ink)}
.pod.r2 .block{height:92px}
.pod.r3 .block{height:72px;background:var(--pitch-2)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
td.pos{font:900 20px/1 var(--font-display);color:var(--muted)}
td.big{font:900 22px/1 var(--font-display)}
.nmcell{display:flex;align-items:center;gap:8px;font-weight:800}
.rules{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);align-items:center}
.rules span{display:flex;align-items:center;gap:6px}

/* Einstellungen */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font:800 24px/1 var(--font-display);text-transform:uppercase}
.panel p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow input[type=text]{flex:1;min-width:120px;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-weight:800}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.field{display:grid;gap:6px}
.field input,.field select{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;width:100%}
.toggle{display:flex;align-items:flex-start;gap:10px;font-weight:600}
.toggle input{width:22px;height:22px;margin-top:1px;accent-color:var(--pitch)}
a{color:var(--pitch)}
:root:not([data-theme="light"]) a{color:inherit}

/* Übergabe */
.handoff{position:fixed;inset:0;z-index:20;background:var(--pc);color:#fff;display:grid;place-items:center;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.handoff .in{display:grid;gap:18px;justify-items:center;max-width:420px}
.handoff .av{width:96px;height:96px;font-size:52px;background:#fff;color:var(--pc)}
.handoff h2{margin:0;font:900 clamp(40px,11vw,64px)/.95 var(--font-display);text-transform:uppercase}
.handoff p{margin:0;font-size:17px;opacity:.92}
.handoff .btn{background:#fff;color:#13211a;font-size:18px;padding:16px 28px}

.sync{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:5px 12px 5px 8px;background:rgba(0,0,0,.22);color:#fff;font-size:13px;font-weight:700}
.sync i{width:9px;height:9px;border-radius:50%;background:#c9d3cc;flex:0 0 auto}
.sync[data-s="ok"] i{background:#7ee2a0}.sync[data-s="busy"] i{background:var(--gold);animation:pulse 1s infinite}
.sync[data-s="login"] i,.sync[data-s="error"] i{background:#ff8a80}.sync[data-s="offline"] i{background:#ffd27a}
.uri{font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:800;z-index:30;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--pitch);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}
@media (max-width:420px){
  .board{font-size:26px}.board b{min-width:32px;height:40px}
  .digit{width:46px;height:50px;font-size:34px}
  .team img{width:22px;height:22px;flex-basis:22px}
  .team{font-size:14px}
}
</style>
</head>
<body>
<header class="head">
  <div class="wrap">
    <div class="brand"><h1>Familien<span>tipp</span></h1><small id="seasonLbl"></small></div>
    <nav class="leagues" id="leagues" aria-label="Wettbewerb"></nav>
    <button class="sync" id="syncBtn" data-act="syncchip" data-s="off"><i></i><span>Nur auf diesem Gerät</span></button>
  </div>
</header>
<div class="tabs"><div class="wrap" role="tablist" id="tabs"></div></div>
<main><div class="wrap" id="view"></div></main>
<div class="dock" id="dock" hidden><div class="wrap"><button class="btn gold" id="doneBtn"></button></div></div>
<div class="handoff" id="handoff" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const OLDB = "https://api.openligadb.de";
const FD = "https://api.football-data.org/v4";
const STORE = "familientipp.v1";
const COMPS = { bl1:"Bundesliga", bl2:"2. Bundesliga", bl3:"3. Liga", cl:"Champions League" };
const COLORS = ["#e4572e","#2e86de","#8e44ad","#16a085","#e84393","#ff8c1a","#3d5afe","#b8860b"];
const FD_STAGE = { LEAGUE_STAGE:"Ligaphase", GROUP_STAGE:"Gruppenphase", PLAYOFFS:"Playoffs", PLAYOFF_ROUND:"Playoffs", LAST_16:"Achtelfinale", QUARTER_FINALS:"Viertelfinale", SEMI_FINALS:"Halbfinale", FINAL:"Finale" };

const now = new Date();
const defaultSeason = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- Speicher ---------- */
function freshState() {
  return {
    v: 1,
    players: [
      { id: uid(), name: "Papa", color: COLORS[1] },
      { id: uid(), name: "Kind 1", color: COLORS[0] },
      { id: uid(), name: "Kind 2", color: COLORS[3] }
    ],
    tips: {}, matches: {}, removed: {}, seeded: true,
    settings: { season: defaultSeason, comp: "bl1", fdKey: "", hideTips: true, lockAtKickoff: true, clLookup: null }
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.v === 1) return Object.assign(freshState(), s, { settings: Object.assign(freshState().settings, s.settings) }); } catch (e) {}
  return freshState();
}
let S = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast("Speichern im Browser nicht möglich – bitte Sicherung nutzen"); } }
}

function changed() { S.seeded = false; save(); scheduleSync(); }
function tipOf(k, pid) { const t = S.tips[k] && S.tips[k][pid]; return t && !t.del ? t : null; }

/* Zwei Spielstände zusammenführen: pro Tipp und Mitspieler gewinnt die neuere Änderung */
function merge(loc, rem) {
  if (!rem || rem.v !== 1) return loc;
  if (loc.seeded) { const r = JSON.parse(JSON.stringify(rem)); r.seeded = false; r.settings = Object.assign(freshState().settings, rem.settings); return r; }
  const out = JSON.parse(JSON.stringify(loc));
  out.removed = Object.assign({}, rem.removed || {});
  for (const id in loc.removed || {}) out.removed[id] = Math.max(out.removed[id] || 0, loc.removed[id]);
  const byId = new Map();
  for (const p of loc.players) byId.set(p.id, p);
  for (const p of rem.players || []) { const l = byId.get(p.id); if (!l || (p.u || 0) > (l.u || 0)) byId.set(p.id, p); }
  const order = [...loc.players.map(p => p.id), ...(rem.players || []).map(p => p.id)];
  out.players = [...new Set(order)].filter(id => !out.removed[id]).map(id => byId.get(id));
  for (const k in rem.tips || {}) {
    out.tips[k] = out.tips[k] || {};
    for (const pid in rem.tips[k]) { const r = rem.tips[k][pid], l = out.tips[k][pid]; if (!l || (r.u || 0) > (l.u || 0)) out.tips[k][pid] = r; }
  }
  for (const k in rem.matches || {}) { const r = rem.matches[k], l = out.matches[k]; if (!l || (r.finished && !l.finished)) out.matches[k] = r; }
  if (!out.settings.fdKey && rem.settings && rem.settings.fdKey) out.settings.fdKey = rem.settings.fdKey;
  out.seeded = false;
  return out;
}

/* ---------- OneDrive (privates Microsoft-Konto) ---------- */
const AUTH_KEY = "familientipp.auth";
const MS = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const SCOPE = "Files.ReadWrite.AppFolder offline_access";
const FILE = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/spielstand.json";
function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; } catch (e) { return {}; } }
let A = loadAuth();
function saveAuth() { try { localStorage.setItem(AUTH_KEY, JSON.stringify(A)); } catch (e) {} }
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
const isHttps = () => location.protocol === "https:" || location.hostname === "localhost";
const connected = () => !!(A.clientId && (A.rt || A.at));
function rand(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._~"[b % 66]).join(""); }
async function challenge(v) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function login(prompt) {
  const v = rand(64), st = rand(20);
  A.pkce = { v, st, prompt: prompt || "" }; saveAuth();
  const q = { client_id: A.clientId, response_type: "code", redirect_uri: redirectUri(), scope: SCOPE, code_challenge: await challenge(v), code_challenge_method: "S256", state: st };
  if (prompt) q.prompt = prompt;
  location.assign(MS + "/authorize?" + new URLSearchParams(q));
}
function setTokens(j) { A.at = j.access_token; if (j.refresh_token) A.rt = j.refresh_token; A.exp = Date.now() + ((j.expires_in || 3600) - 120) * 1000; A.needLogin = false; saveAuth(); }
async function tokenRequest(body) {
  const r = await fetch(MS + "/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(Object.assign({ client_id: A.clientId, scope: SCOPE }, body)) });
  const j = await r.json().catch(() => ({}));

function points(tip, h, a) {
  if (!tip || tip.h == null || tip.a == null || h == null || a == null) return null;
  if (tip.h === h && tip.a === a) return 3;
  if (tip.h - tip.a === h - a) return 2;
  if (Math.sign(tip.h - tip.a) === Math.sign(h - a)) return 1;
  return 0;
}

async function getJSON(url, headers) {
  const r = await fetch(url, { headers: headers || {} });
  if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();

/* ---------- Datenquellen ---------- */
async function provider(comp, season) {
  if (comp !== "cl") return { type: "oldb", sc: comp };
  const L = S.settings.clLookup;
  const fresh = L && L.season === season && (L.sc || Date.now() - L.at < 864e5);
  if (!fresh) {
    try {
      const leagues = await getJSON(OLDB + "/getavailableleagues");
      const hit = leagues.find(l => Number(l.leagueSeason) === season && /champions/i.test(l.leagueName || "") && !/women|frauen|youth|jugend|u19/i.test(l.leagueName || "") && (!l.sport || l.sport.sportId === 1));
      S.settings.clLookup = { season, sc: hit ? hit.leagueShortcut : null, at: Date.now() }; save();
    } catch (e) { /* weiter mit football-data */ }
  }
  const L2 = S.settings.clLookup;
  if (L2 && L2.season === season && L2.sc) return { type: "oldb", sc: L2.sc };
  if (S.settings.fdKey) return { type: "fd" };
  const e = new Error("cl_nokey"); e.code = "cl_nokey"; throw e;
}

function normOldb(m, comp, season, roundId) {
  const kickoff = toDate(m.matchDateTimeUTC || m.matchDateTime);
  let h = null, a = null;
  const res = (m.matchResults || []);
  const end = res.find(r => r.resultTypeID === 2) || res.slice().sort((x, y) => (y.resultOrderID || 0) - (x.resultOrderID || 0))[0];
  if (m.matchIsFinished && end) { h = end.pointsTeam1; a = end.pointsTeam2; }
  else if (m.goals && m.goals.length) { const g = m.goals[m.goals.length - 1]; h = g.scoreTeam1; a = g.scoreTeam2; }
  else if (end && !m.matchIsFinished) { h = end.pointsTeam1; a = end.pointsTeam2; }
  else if (kickoff && kickoff <= new Date()) { h = 0; a = 0; }
  return {
    key: "o:" + m.matchID, comp, season, round: roundId,
    home: m.team1.shortName || m.team1.teamName, away: m.team2.shortName || m.team2.teamName,
    homeIcon: m.team1.teamIconUrl || "", awayIcon: m.team2.teamIconUrl || "",
    kickoff: kickoff ? kickoff.toISOString() : null,
    finished: !!m.matchIsFinished, h, a
  };
}
function normFd(m, season, roundId) {
  const ft = (m.score && m.score.fullTime) || {};
  const live = ["IN_PLAY", "PAUSED", "LIVE"].includes(m.status);
  return {
    key: "f:" + m.id, comp: "cl", season, round: roundId,
    home: (m.homeTeam && (m.homeTeam.shortName || m.homeTeam.name)) || "offen",
    away: (m.awayTeam && (m.awayTeam.shortName || m.awayTeam.name)) || "offen",
    homeIcon: (m.homeTeam && m.homeTeam.crest) || "", awayIcon: (m.awayTeam && m.awayTeam.crest) || "",
    kickoff: m.utcDate, finished: m.status === "FINISHED",
    h: (m.status === "FINISHED" || live) ? (ft.home ?? 0) : null,
    a: (m.status === "FINISHED" || live) ? (ft.away ?? 0) : null
  };
}
function storeMatches(list) {
  for (const m of list) S.matches[m.key] = Object.assign(S.matches[m.key] || {}, m);
  save();
  return list.map(m => m.key);
}

async function fdSeason(season) {
  const d = await getJSON(FD + "/competitions/CL/matches?season=" + season, { "X-Auth-Token": S.settings.fdKey });
  const groups = new Map();
  for (const m of d.matches || []) {
    const id = (m.stage || "X") + "-" + (m.matchday || 0);
    if (!groups.has(id)) {
      const st = FD_STAGE[m.stage] || (m.stage || "").replace(/_/g, " ").toLowerCase();
      const name = (m.stage === "LEAGUE_STAGE" || m.stage === "GROUP_STAGE") && m.matchday ? m.matchday + ". Spieltag" : st;
      groups.set(id, { id, name, first: m.utcDate, list: [] });
    }
    const g = groups.get(id); g.list.push(m); if (m.utcDate < g.first) g.first = m.utcDate;
  }
  const rounds = [...groups.values()].sort((x, y) => x.first < y.first ? -1 : 1);
  // gleiche Namen (Hin-/Rückspiel) unterscheiden
  const seen = {};
  rounds.forEach(r => { seen[r.name] = (seen[r.name] || 0) + 1; });
  const cnt = {};
  rounds.forEach(r => { if (seen[r.name] > 1 && !/Spieltag/.test(r.name)) { cnt[r.name] = (cnt[r.name] || 0) + 1; r.name += cnt[r.name] === 1 ? " · Hinspiel" : " · Rückspiel"; } });
  const out = {};
  for (const r of rounds) out[r.id] = storeMatches(r.list.map(m => normFd(m, season, r.id)));
  return { rounds: rounds.map(r => ({ id: r.id, name: r.name })), byRound: out };
}

async function loadRounds() {
  const comp = S.settings.comp, season = S.settings.season, key = ck();
  if (ui.rounds[key]) return;
  const p = await provider(comp, season);
  if (p.type === "oldb") {
    const groups = await getJSON(OLDB + "/getavailablegroups/" + p.sc + "/" + season);
    const rounds = groups.filter(g => g.groupOrderID).sort((x, y) => x.groupOrderID - y.groupOrderID)
      .map(g => ({ id: String(g.groupOrderID), name: g.groupName || (g.groupOrderID + ". Spieltag") }));
    if (!rounds.length) { const e = new Error("empty"); e.code = "empty"; throw e; }
    ui.rounds[key] = rounds;
    let idx = 0;
    try {
      const cur = await getJSON(OLDB + "/getcurrentgroup/" + p.sc);
      const i = rounds.findIndex(r => r.id === String(cur.groupOrderID));
      if (i >= 0 && season === defaultSeason) idx = i;
    } catch (e) {}
    if (ui.roundIdx[key] == null) ui.roundIdx[key] = idx;
  } else {
    const r = await fdSeason(season);
    if (!r.rounds.length) { const e = new Error("empty"); e.code = "empty"; throw e; }
    ui.rounds[key] = r.rounds;
    for (const id in r.byRound) ui.roundMatches[key + ":" + id] = r.byRound[id];
    if (ui.roundIdx[key] == null) {
      let i = r.rounds.findIndex(rd => r.byRound[rd.id].some(k => !S.matches[k].finished));
      ui.roundIdx[key] = i < 0 ? r.rounds.length - 1 : i;
    }
  }
}

async function loadRound(force) {
  const key = ck(), rounds = ui.rounds[key]; if (!rounds) return;
  const r = rounds[ui.roundIdx[key]], rk = key + ":" + r.id;
  if (ui.roundMatches[rk] && !force) return;
  const p = await provider(S.settings.comp, S.settings.season);
  if (p.type === "oldb") {
    const list = await getJSON(OLDB + "/getmatchdata/" + p.sc + "/" + S.settings.season + "/" + r.id);
    ui.roundMatches[rk] = storeMatches(list.map(m => normOldb(m, S.settings.comp, S.settings.season, r.id)));
  } else {
    const res = await fdSeason(S.settings.season);
    for (const id in res.byRound) ui.roundMatches[key + ":" + id] = res.byRound[id];
  }
}

/* Laufende/offene getippte Spiele im Hintergrund aktualisieren */
async function refreshPending() {
  const need = new Map();
  for (const k in S.tips) {
    const m = S.matches[k];
    if (!m || m.finished || !started(m)) continue;
    const id = m.comp + ":" + m.season + ":" + (k.startsWith("f:") ? "*" : m.round);
    need.set(id, m);
  }
  let n = 0;
  for (const [id, m] of need) {
    if (n++ >= 6) break;
    try {
      if (id.endsWith(":*")) {
        if (!S.settings.fdKey) continue;
        const res = await fdSeason(m.season);
        for (const r in res.byRound) ui.roundMatches["cl:" + m.season + ":" + r] = res.byRound[r];
      } else {
        const p = await provider(m.comp, m.season);
        const list = await getJSON(OLDB + "/getmatchdata/" + p.sc + "/" + m.season + "/" + m.round);
        ui.roundMatches[m.comp + ":" + m.season + ":" + m.round] = storeMatches(list.map(x => normOldb(x, m.comp, m.season, m.round)));
      }
    } catch (e) {}
  }
  if (need.size) render();
}

function byDay(list, fn) {

}

  if (list.some(m => started(m))) {
    html += `<div class="panel" style="gap:8px"><div class="label">Punkte an diesem Spieltag${list.every(m => m.finished) ? "" : " (vorläufig)"}</div><div class="players">${
      sums.sort((a, b) => b.s - a.s).map(x => `<span class="pchip" style="--pc:${x.p.color}"><span class="av">${initial(x.p.name)}</span>${esc(x.p.name)} <span class="pts p3" style="margin-left:4px">${x.s}</span></span>`).join("")}</div></div>`;
  }
  html += byDay(list, m => {
    const show = !S.settings.hideTips || started(m);
    const chips = S.players.map(p => {
      const t = tipOf(m.key, p.id);
      let inner;
      if (!t) inner = `<span class="hid">kein Tipp</span>`;
      else if (!show) inner = `<span class="hid">getippt</span>`;
      else {
        const pt = m.h != null && started(m) ? points(t, m.h, m.a) : null;
        inner = `${t.h}:${t.a}${pt != null ? ` <span class="pts p${pt}${m.finished ? "" : " prov"}">+${pt}</span>` : ""}`;
      }
      return `<span class="tchip" title="${esc(p.name)}" style="--pc:${p.color}"><span class="av">${initial(p.name)}</span>${inner}&nbsp;</span>`;
    }).join("");
    return `<div class="match"><div class="mrow">${teamHTML(m.home, m.homeIcon)}${boardHTML(m)}${teamHTML(m.away, m.awayIcon, true)}</div>
      <div class="meta"><span>${m.kickoff ? fmtTime(new Date(m.kickoff)) + " Uhr" : ""}</span>${statusPill(m)}</div>
      ${S.players.length ? `<div class="tips">${chips}</div>` : ""}</div>`;
  });
  if (S.settings.hideTips) html += `<p class="muted" style="margin:0;font-size:13px">Die Tipps der anderen werden erst zum Anpfiff aufgedeckt.</p>`;
  return html + `<div><button class="btn ghost small" data-act="reload">Ergebnisse aktualisieren</button></div>`;
}

function viewTabelle() {
  const key = ck(), rounds = ui.rounds[key];
  const r = rounds ? rounds[ui.roundIdx[key]] : null;
  const scope = ui.tableScope;
  const filt = m => m.finished && (scope === "all" || (m.comp === S.settings.comp && m.season === S.settings.season && (scope === "comp" || m.round === (r && r.id))));
  const rows = S.players.map(p => {
    const o = { p, pts: 0, c3: 0, c2: 0, c1: 0, n: 0 };
    for (const k in S.tips) {
      const m = S.matches[k], t = tipOf(k, p.id);
      if (!m || !t || !filt(m)) continue;
      const pt = points(t, m.h, m.a); o.n++; o.pts += pt;
      if (pt === 3) o.c3++; else if (pt === 2) o.c2++; else if (pt === 1) o.c1++;
    }
    return o;
  }).sort((a, b) => b.pts - a.pts || b.c3 - a.c3 || b.c2 - a.c2 || a.p.name.localeCompare(b.p.name));
  let pos = 0, prev = null;
  rows.forEach((o, i) => { const sig = o.pts + "|" + o.c3 + "|" + o.c2; if (sig !== prev) pos = i + 1; o.pos = pos; prev = sig; });

  let html = `<div class="seg" role="group" aria-label="Zeitraum">
    <button data-act="scope" data-v="all" aria-pressed="${scope === "all"}">Gesamt</button>
    <button data-act="scope" data-v="comp" aria-pressed="${scope === "comp"}">${COMPS[S.settings.comp]}</button>
    <button data-act="scope" data-v="round" aria-pressed="${scope === "round"}" ${r ? "" : "disabled"}>${r ? esc(r.name) : "Spieltag"}</button>
  </div>`;
  const anyTips = rows.some(o => o.n);
  if (!anyTips) {
    html += `<div class="notice"><h3>Noch keine Punkte</h3><p>Sobald die ersten getippten Spiele abgepfiffen sind, steht hier, wer vorne liegt.</p></div>`;
  } else {
    const top = rows.slice(0, 3);
    const order = [top[1], top[0], top[2]];
    html += `<div class="podium">${order.map(o => {
      if (!o) return "<div></div>";
      const cls = o.pos === 1 ? "r1" : o.pos === 2 ? "r2" : "r3";
      return `<div class="pod ${cls}" style="--pc:${o.p.color}"><span class="av">${initial(o.p.name)}</span><span class="nm">${esc(o.p.name)}</span><div class="block">${o.pts}<small>${o.pos}. Platz</small></div></div>`;
    }).join("")}</div>`;
  }
  html += `<div class="tablewrap"><table><thead><tr><th>#</th><th>Name</th><th>Pkt</th><th title="Exaktes Ergebnis">3er</th><th title="Richtige Tordifferenz">2er</th><th title="Richtige Tendenz">1er</th><th>Tipps</th></tr></thead><tbody>${
    rows.map(o => `<tr><td class="pos">${o.pos}</td><td><span class="nmcell" style="--pc:${o.p.color}"><span class="av">${initial(o.p.name)}</span>${esc(o.p.name)}</span></td><td class="big">${o.pts}</td><td>${o.c3}</td><td>${o.c2}</td><td>${o.c1}</td><td class="muted">${o.n}</td></tr>`).join("")
  }</tbody></table></div>`;
  html += `<div class="rules"><span><span class="pts p3">3</span>exaktes Ergebnis</span><span><span class="pts p2">2</span>richtige Tordifferenz</span><span><span class="pts p1">1</span>richtige Tendenz</span></div>`;
  return html;
}

function viewMehr() {
  const st = S.settings;
  const seasons = []; for (let y = defaultSeason; y >= defaultSeason - 3; y--) seasons.push(y);
  return `<section class="panel"><h3>Mitspieler</h3>
    ${S.players.map(p => `<div class="prow" style="--pc:${p.color}">
      <span class="av">${initial(p.name)}</span>
      <input type="text" id="pn-${p.id}" value="${esc(p.name)}" data-act="rename" data-v="${p.id}" aria-label="Name" maxlength="20">
      <div class="swatches">${COLORS.map(c => `<button class="sw" style="--c:${c}" data-act="color" data-v="${p.id}" data-c="${c}" aria-pressed="${p.color === c}" aria-label="Farbe"></button>`).join("")}</div>
      ${ui.confirmDel === p.id
        ? `<button class="btn small danger" data-act="del" data-v="${p.id}">Wirklich löschen</button><button class="btn small ghost" data-act="delcancel">Abbrechen</button>`
        : `<button class="linkbtn" data-act="delask" data-v="${p.id}">Entfernen</button>`}
    </div>`).join("")}
    <div><button class="btn small" data-act="add">Mitspieler hinzufügen</button></div>
  </section>
  ${viewOneDrive()}
  <section class="panel"><h3>Spielregeln</h3>
    <label class="toggle"><input type="checkbox" id="optLock" data-act="opt" data-v="lockAtKickoff" ${st.lockAtKickoff ? "checked" : ""}><span>Tipps zum Anpfiff sperren</span></label>
    <label class="toggle"><input type="checkbox" id="optHide" data-act="opt" data-v="hideTips" ${st.hideTips ? "checked" : ""}><span>Tipps der anderen bis zum Anpfiff verdecken (kein Abgucken)</span></label>
    <p>Punkte: 3 für das exakte Ergebnis, 2 für die richtige Tordifferenz, 1 für die richtige Tendenz.</p>
  </section>
  <section class="panel"><h3>Saison</h3>
    <div class="field"><label class="label" for="seasonSel">Spielzeit</label><select id="seasonSel">${seasons.map(y => `<option value="${y}" ${y === st.season ? "selected" : ""}>${y}/${String(y + 1).slice(2)}</option>`).join("")}</select></div>
  </section>
  <section class="panel"><h3>Champions League</h3>
    <p>Bundesliga, 2. und 3. Liga kommen von OpenLigaDB. Wenn es dort keine Champions League gibt, nutzt die App football-data.org. Dafür brauchst du einen kostenlosen Schlüssel: <a href="https://www.football-data.org/client/register" target="_blank" rel="noopener">hier registrieren</a>.</p>
    <div class="field"><label class="label" for="fdKey">API-Schlüssel football-data.org</label><input type="text" id="fdKey" value="${esc(st.fdKey)}" autocomplete="off" placeholder="z. B. 1a2b3c…"></div>
    <div><button class="btn small" data-act="saveKey">Schlüssel speichern</button></div>
  </section>
  <section class="panel"><h3>Sicherung</h3>
    <p>Alle Tipps liegen nur in diesem Browser. Mach ab und zu eine Sicherung, z. B. vor dem Löschen des Browserverlaufs.</p>
    <div class="prow"><button class="btn small" data-act="export">Sicherung herunterladen</button>
    <label class="btn small ghost" for="importFile" style="display:inline-block">Sicherung laden</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
  </section>`;
}

function viewOneDrive() {
  let body;
  if (!isHttps()) body = `<p>Die OneDrive-Speicherung funktioniert, sobald die App im Internet liegt (Adresse mit https://). Als lokal geöffnete Datei bleibt alles nur auf diesem Gerät.</p>`;
  else if (!A.clientId) body = `<p>Einmalig einrichten: Registriere die App bei Microsoft und trage als Umleitungs-URI genau diese Adresse ein:</p>
    <div class="uri">${esc(redirectUri())}</div><div><button class="btn small ghost" data-act="copyUri">Adresse kopieren</button></div>
    <div class="field"><label class="label" for="msClientId">Anwendungs-ID (Client-ID)</label><input type="text" id="msClientId" autocomplete="off" placeholder="1a2b3c4d-0000-0000-0000-000000000000"></div>
    <div><button class="btn small" data-act="msSaveId">Speichern</button></div>`;
  else if (!connected()) body = `<p>Melde dich mit deinem privaten Microsoft-Konto an. Danach wird jeder Tipp automatisch in OneDrive gespeichert, im Ordner Apps / Familientipp.</p>
    <div class="prow"><button class="btn" data-act="msConnect">Mit OneDrive verbinden</button><button class="linkbtn" data-act="msResetId">Client-ID ändern</button></div>`;
  else body = `<p>Verbunden. Jeder Tipp wird automatisch gespeichert${A.last ? ", zuletzt um " + new Date(A.last).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr" : ""}. Auf einem anderen Gerät einfach dieselbe Adresse öffnen und mit demselben Konto verbinden.</p>
    <div class="prow"><button class="btn small" data-act="msSync">Jetzt abgleichen</button><button class="btn small ghost" data-act="msDisconnect">Trennen</button></div>`;
  return `<section class="panel" id="onedrive"><h3>OneDrive</h3>${body}</section>`;
}

function renderDock() {
  const dock = $("dock");
  const list = ui.view === "tippen" && !ui.error ? currentMatches() : null;
  const open = list && list.some(m => !(S.settings.lockAtKickoff && started(m)));
  if (!open || S.players.length < 2) { dock.hidden = true; return; }
  const i = S.players.findIndex(p => p.id === ui.playerId);
  const next = S.players[(i + 1) % S.players.length];
  $("doneBtn").textContent = "Fertig! Weiter an " + next.name;
  $("doneBtn").dataset.next = next.id;
  dock.hidden = false;
}

function render() {
  renderHeader(); renderSync();
  const v = ui.view;
  $("view").innerHTML = v === "tippen" ? viewTippen() : v === "spieltag" ? viewSpieltag() : v === "tabelle" ? viewTabelle() : viewMehr();
  renderDock();
}

function showHandoff(pid) {
  const p = player(pid); if (!p) return;
  const h = $("handoff");
  h.style.setProperty("--pc", p.color);
  h.innerHTML = `<div class="in"><span class="av">${initial(p.name)}</span><h2>${esc(p.name)} ist dran</h2><p>Gib das Gerät an ${esc(p.name)} weiter. Die anderen schauen bitte weg.</p><button class="btn" id="handoffGo">Ich bin ${esc(p.name)} – los geht's</button></div>`;
  h.hidden = false;
  $("handoffGo").focus();
  $("handoffGo").onclick = () => { h.hidden = true; ui.playerId = pid; render(); window.scrollTo({ top: 0 }); };
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "comp") { S.settings.comp = v; save(); ui.error = null; refresh(); }
  else if (a === "view") { ui.view = v; ui.confirmDel = null; render(); window.scrollTo({ top: 0 }); }
  else if (a === "round") { const k = ck(); const n = ui.roundIdx[k] + Number(b.dataset.d); if (n >= 0 && n < ui.rounds[k].length) { ui.roundIdx[k] = n; refresh(); } }
  else if (a === "pick") {
    if (v === ui.playerId) return;
    if (S.settings.hideTips) showHandoff(v); else { ui.playerId = v; render(); }
  }
  else if (a === "step") {
    const k = b.dataset.k, m = S.matches[k];
    if (S.settings.lockAtKickoff && started(m)) { toast("Das Spiel läuft schon – Tipp gesperrt"); render(); return; }
    S.tips[k] = S.tips[k] || {};
    const t = Object.assign({ h: 0, a: 0 }, tipOf(k, ui.playerId));
    t[b.dataset.s] = Math.max(0, Math.min(15, t[b.dataset.s] + Number(b.dataset.d)));
    t.u = Date.now(); S.tips[k][ui.playerId] = t;
    changed(); render();
  }
  else if (a === "clear") { if (tipOf(b.dataset.k, ui.playerId)) { S.tips[b.dataset.k][ui.playerId] = { del: 1, u: Date.now() }; changed(); render(); } }
  else if (a === "reload") { refresh(true); }
  else if (a === "syncchip") { if (ui.sync === "login") login(); else if (connected()) syncNow(); else { ui.view = "einstellungen"; render(); setTimeout(() => { const el = $("onedrive"); if (el) el.scrollIntoView({ behavior: "smooth" }); }, 50); } }
  else if (a === "msSaveId") { const id = $("msClientId").value.trim(); if (!/^[0-9a-f-]{36}$/i.test(id)) { toast("Die Client-ID hat das Format 1a2b3c4d-…-… (36 Zeichen)"); return; } A.clientId = id; saveAuth(); render(); toast("Client-ID gespeichert"); }
  else if (a === "msConnect") { silentTried = true; login(); }
  else if (a === "msSync") { syncNow(); }
  else if (a === "msDisconnect") { A = { clientId: A.clientId }; saveAuth(); ui.sync = "off"; render(); toast("Von OneDrive getrennt – die Tipps bleiben auf diesem Gerät"); }
  else if (a === "msResetId") { A = {}; saveAuth(); ui.sync = "off"; render(); }
  else if (a === "copyUri") { const u = redirectUri(); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Adresse kopiert"), () => toast("Bitte die Adresse markieren und kopieren")); }
  else if (a === "scope") { ui.tableScope = v; render(); }
  else if (a === "add") { const used = S.players.map(p => p.color); S.players.push({ id: uid(), name: "Neu", color: COLORS.find(c => !used.includes(c)) || COLORS[S.players.length % COLORS.length], u: Date.now() }); changed(); render(); const inp = document.getElementById("pn-" + S.players[S.players.length - 1].id); if (inp) { inp.focus(); inp.select(); } }
  else if (a === "color") { const p = player(v); p.color = b.dataset.c; p.u = Date.now(); changed(); render(); }
  else if (a === "delask") { ui.confirmDel = v; render(); }
  else if (a === "delcancel") { ui.confirmDel = null; render(); }
  else if (a === "del") { S.players = S.players.filter(p => p.id !== v); S.removed = S.removed || {}; S.removed[v] = Date.now(); ui.confirmDel = null; changed(); render(); toast("Mitspieler entfernt"); }
  else if (a === "saveKey" || a === "saveKeyInline") {
    const inp = $(a === "saveKey" ? "fdKey" : "fdKeyInline");
    S.settings.fdKey = inp.value.trim(); changed(); delete ui.rounds["cl:" + S.settings.season];
    toast(S.settings.fdKey ? "Schlüssel gespeichert" : "Schlüssel entfernt");
    if (a === "saveKeyInline") refresh(); else render();
  }
  else if (a === "export") {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const l = document.createElement("a"); l.href = url; l.download = "familientipp-sicherung-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
});
$("doneBtn").addEventListener("click", e => showHandoff(e.currentTarget.dataset.next));
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "roundSel") { ui.roundIdx[ck()] = Number(t.value); refresh(); }
  else if (t.id === "seasonSel") { S.settings.season = Number(t.value); save(); refresh(); }
  else if (t.dataset.act === "opt") { S.settings[t.dataset.v] = t.checked; changed(); }
  else if (t.dataset.act === "rename") { const p = player(t.dataset.v); p.name = t.value.trim() || p.name; p.u = Date.now(); changed(); render(); }
  else if (t.id === "importFile" && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (d.v !== 1 || !Array.isArray(d.players)) throw 0; S = Object.assign(freshState(), d, { settings: Object.assign(freshState().settings, d.settings) }); S.seeded = false; save(); if (A.clientId) scheduleSync(); ui.playerId = S.players[0] && S.players[0].id; ui.rounds = {}; ui.roundMatches = {}; toast("Sicherung geladen"); refresh(); } catch (err) { toast("Diese Datei ist keine Familientipp-Sicherung"); } };
    r.readAsText(t.files[0]);
  }
});

(async () => {
  try { await handleRedirect(); } catch (e) {}
  ui.sync = connected() ? null : (A.needLogin && A.clientId ? "login" : "off");
  render();
  if (connected()) syncNow();
  refresh().then(refreshPending);
})();
setInterval(() => { if (document.visibilityState === "visible") refreshPending(); }, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { refreshPending(); if (connected()) syncNow(); } });
window.addEventListener("online", () => { if (connected()) syncNow(); });
})();
</script>
</body>
</html>
